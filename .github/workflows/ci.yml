name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Python files compile
        run: python -m py_compile $(git ls-files '*.py')
      - name: Node scripts parse
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Skills are self-contained, and the release zip builds
        run: |
          python tools/sync.py --check
          python tools/build_zip.py

      - name: Plugin and marketplace validate
        run: npx -y @anthropic-ai/claude-code plugin validate .
        continue-on-error: true   # informational if the CLI needs sign-in on the runner

  test:
    name: Test (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VIDEO_STUDIO_HOME: ${{ github.workspace }}/.vs-home
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1

      - name: Install Python packages
        run: python -m pip install numpy pillow "opencv-python-headless<5" faster-whisper

      - name: Tests with known answers
        run: python tests/run_tests.py

      - name: Doctor
        run: python skills/reel-edit/scripts/doctor.py --fix

      - name: Reel template installs, typechecks, renders
        run: |
          cp -r skills/reel-edit/assets/reel-project "$RUNNER_TEMP/reels"
          cd "$RUNNER_TEMP/reels"
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx remotion still src/index.ts HookMeasure out/m.png --log=error
          python "$GITHUB_WORKSPACE/skills/reel-edit/scripts/measure-hook.py" out/m.png 300 2
          npx remotion render src/index.ts Example out/example.mp4 --frames=0-59 --concurrency=75% --log=error
          python "$GITHUB_WORKSPACE/skills/reel-edit/scripts/detect-cuts.py" out/example.mp4 --fps 30 --no-sheets

      - name: "setup + real transcription (Windows: setup.cmd, as a double-click would)"
        run: |
          cp -r skills/reel-edit/assets/reel-project "$RUNNER_TEMP/runsh"
          cd "$RUNNER_TEMP/runsh"
          if [ "$RUNNER_OS" = Windows ]; then cmd //c setup.cmd | tee setup.log; else bash run.sh setup | tee setup.log; fi
          grep -q "All set" setup.log
          grep -qi "fellow americans" setup.log   # whisper.cpp + base.en heard the JFK sample
          bash run.sh doctor
          bash run.sh transcribe bin/whisper.cpp/samples/jfk.wav
          python -c "import json; w=json.load(open('bin/whisper.cpp/samples/jfk.words.json')); assert len(w) > 15 and w[0]['startMs'] < 1500, w[:3]; print(len(w), 'words, first:', w[0])"
          bash run.sh render Example --frames=0-29
          test -s out/Example.mp4
          mkdir -p public/recordings/raw && cp out/Example.mp4 public/recordings/raw/one.mp4 && cp out/Example.mp4 public/recordings/raw/two.mp4
          bash run.sh assemble public/recordings/raw --out public/recordings/reel.mp4   # a whole folder
          test -s public/recordings/reel.mp4

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/reels/out/m.png
          if-no-files-found: ignore
